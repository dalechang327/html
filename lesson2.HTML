<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>HTML 基礎標籤範例</title>
</head>
<body>

  <!-- 1. 圖片標籤 <img> -->
  <h2>圖片範例</h2>
  <img src="https://picsum.photos/200/150" alt="隨機範例圖片">

  <hr>

  <!-- 2. 超連結標籤 <a> -->
  <h2>超連結範例</h2>
  <a href="https://www.google.com" target="_blank">點我前往 Google</a>

  <hr>

  <!-- 3. 按鈕標籤 <button> -->
  <h2>按鈕範例</h2>
  <button type="button" onclick="alert('你點擊了按鈕！')">點我跳出提示</button>

</body>
</html>
